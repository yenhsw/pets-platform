jakarta.validation.constraints.Digits.message        = Số chữ số không hợp lệ (tối đa {integer} chữ số nguyên và {fraction} chữ số thập phân)

# ── Length ───────────────────────────────────────────────

jakarta.validation.constraints.Length.message       = Độ dài phải từ {min} đến {max} ký tự

