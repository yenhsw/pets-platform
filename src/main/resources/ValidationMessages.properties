jakarta.validation.constraints.Size.message          = Độ dài phải từ {min} đến {max} ký tự
jakarta.validation.constraints.Size.List.message     = Độ dài phải từ {min} đến {max} ký tự

# ── Email ─────────────────────────────────────────────────

jakarta.validation.constraints.Email.message         = Email không hợp lệ

# ── Pattern ──────────────────────────────────────────────

jakarta.validation.constraints.Pattern.message       = Định dạng không đúng

